name: detections

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull Suricata image
        run: docker pull jasonish/suricata:latest

      - name: Suricata rules - syntax, coverage and behaviour tests
        run: make test-suricata ENGINE=docker

      - name: YARA rules - compile, coverage and behaviour tests
        run: make test-yara
